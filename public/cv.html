<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(s){s.dataset.zone='11194135',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Free CV & Resume Builder — 5 professional templates, live preview, color picker, PDF download. No signup."/>
  <title>Free CV Builder — Professional Templates | CoverCraft AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800;900&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f1f5f9;--surface:#fff;--surface2:#f8fafc;--border:#e2e8f0;--border2:#cbd5e1;
      --text:#0f172a;--sub:#475569;--muted:#94a3b8;
      --blue:#2563eb;--blue-h:#1d4ed8;--blue-s:#eff6ff;--blue-b:#bfdbfe;
      --green:#059669;--red:#dc2626;--warning:#d97706;
      --r:10px;--shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.06);
      --shadow-lg:0 8px 40px rgba(0,0,0,.14);
    }
    [data-theme="dark"]{
      --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--border2:#484f58;
      --text:#e6edf3;--sub:#8b949e;--muted:#6e7681;
      --blue:#3b82f6;--blue-h:#60a5fa;--blue-s:#1e3a5f;--blue-b:#1e40af;
      --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    }
    html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;overflow:hidden}
    @media(max-width:900px){body{overflow:auto}}

    /* ── TOP BAR ── */
    .topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:1rem;position:fixed;top:0;left:0;right:0;z-index:600}
    .tb-brand{display:flex;align-items:center;gap:7px;text-decoration:none;flex-shrink:0}
    .tb-logo{width:28px;height:28px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center}
    .tb-logo svg{width:13px;height:13px}
    .tb-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:800;color:var(--text);letter-spacing:-.03em}
    .tb-sep{width:1px;height:24px;background:var(--border);flex-shrink:0}
    .tb-title{font-size:.82rem;font-weight:600;color:var(--sub);flex-shrink:0}
    .tb-nav{display:flex;align-items:center;gap:2px;flex:1}
    @media(max-width:640px){.tb-nav{display:none}}
    .tb-a{font-size:.78rem;font-weight:500;color:var(--muted);text-decoration:none;padding:4px 9px;border-radius:6px;transition:all .15s}
    .tb-a:hover,.tb-a.active{color:var(--blue);background:var(--blue-s)}
    .tb-right{margin-left:auto;display:flex;align-items:center;gap:7px}
    .tb-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;border:none;white-space:nowrap}
    .tb-btn.primary{background:var(--blue);color:#fff}
    .tb-btn.primary:hover{background:var(--blue-h);transform:translateY(-1px);box-shadow:0 3px 12px rgba(37,99,235,.3)}
    .tb-btn.sec{background:var(--surface2);color:var(--sub);border:1px solid var(--border2)}
    .tb-btn.sec:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-s)}
    .icon-btn{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);transition:all .15s;flex-shrink:0}
    .icon-btn:hover{background:var(--blue-s);color:var(--blue);border-color:var(--blue-b)}

    /* ── LAYOUT ── */
    .layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 56px);margin-top:56px}
    @media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}}

    /* ── LEFT PANEL ── */
    .panel{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;height:100%;scrollbar-width:thin}
    .panel::-webkit-scrollbar{width:4px}
    .panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
    @media(max-width:900px){.panel{height:auto;border-right:none;border-bottom:1px solid var(--border)}}

    /* Template tabs */
    .tpl-header{padding:1rem 1.25rem .75rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:10}
    .tpl-header-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.75rem}
    .tpl-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .tpl-tabs::-webkit-scrollbar{display:none}
    .tpl-tab{flex-shrink:0;cursor:pointer;border-radius:9px;border:2px solid var(--border);overflow:hidden;transition:all .15s;background:var(--surface2);width:64px}
    .tpl-tab:hover{border-color:var(--blue-b)}
    .tpl-tab.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .tpl-tab-img{width:64px;height:80px;display:block;object-fit:cover}
    .tpl-tab-name{font-size:.58rem;font-weight:600;text-align:center;padding:3px 2px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tpl-tab.active .tpl-tab-name{color:var(--blue)}

    /* Color row */
    .color-section{padding:.85rem 1.25rem;border-bottom:1px solid var(--border)}
    .color-section-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.6rem}
    .color-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .cswatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .15s;flex-shrink:0;position:relative}
    .cswatch:hover{transform:scale(1.2)}
    .cswatch.active::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--blue)}
    .cpicker-wrap{width:24px;height:24px;border-radius:50%;overflow:hidden;cursor:pointer;flex-shrink:0;border:2px solid var(--border2);background:conic-gradient(red 0deg,yellow 60deg,lime 120deg,cyan 180deg,blue 240deg,magenta 300deg,red 360deg)}
    .cpicker-wrap input{opacity:0;width:100%;height:100%;cursor:pointer}

    /* Form sections */
    .sections-wrap{padding:.5rem 0 2rem}
    .form-sect{border-bottom:1px solid var(--border)}
    .form-sect-head{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;cursor:pointer;user-select:none;transition:background .12s}
    .form-sect-head:hover{background:var(--surface2)}
    .form-sect-left{display:flex;align-items:center;gap:9px}
    .form-sect-icon{width:28px;height:28px;border-radius:7px;background:var(--blue-s);border:1px solid var(--blue-b);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .form-sect-icon svg{color:var(--blue)}
    .form-sect-title{font-size:.84rem;font-weight:600;color:var(--text)}
    .form-sect-arrow{color:var(--muted);transition:transform .2s;flex-shrink:0}
    .form-sect-head.open .form-sect-arrow{transform:rotate(180deg)}
    .form-sect-body{display:none;padding:.25rem 1.25rem 1.25rem}
    .form-sect-body.open{display:flex;flex-direction:column;gap:.7rem}

    /* Fields */
    .field{display:flex;flex-direction:column;gap:4px}
    .field label{font-size:.73rem;font-weight:600;color:var(--sub)}
    .field input,.field textarea,.field select{font-family:'Inter',sans-serif;font-size:.83rem;color:var(--text);background:var(--surface2);border:1.5px solid var(--border2);border-radius:8px;padding:8px 10px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .field input::placeholder,.field textarea::placeholder{color:var(--muted)}
    .field textarea{resize:vertical;min-height:72px;line-height:1.55}
    .fg2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

    /* Repeat items */
    .rep-item{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:.85rem;margin-bottom:.6rem;position:relative}
    .rep-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem}
    .rep-item-label{font-size:.78rem;font-weight:700;color:var(--text)}
    .rep-actions{display:flex;gap:4px}
    .rep-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:3px 6px;border-radius:5px;font-size:.78rem;transition:all .15s;line-height:1}
    .rep-btn:hover{background:var(--bg);color:var(--red)}
    .rep-btn.up:hover,.rep-btn.dn:hover{color:var(--blue)}
    .add-btn{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--blue);background:var(--blue-s);border:1.5px dashed var(--blue-b);border-radius:8px;padding:7px 12px;cursor:pointer;transition:all .15s;width:100%;justify-content:center;font-family:'Inter',sans-serif}
    .add-btn:hover{background:var(--blue-b);border-style:solid}

    /* Skill slider */
    .skill-slider{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--border2);outline:none;cursor:pointer;border:none;padding:0}
    .skill-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}

    /* ── RIGHT — PREVIEW ── */
    .preview-wrap{background:#d1d5db;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;gap:1rem}
    [data-theme="dark"] .preview-wrap{background:#090d12}
    @media(max-width:900px){.preview-wrap{min-height:600px}}
    .preview-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .zoom-btn{width:30px;height:30px;border-radius:6px;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;color:#1a1a1a;transition:all .15s}
    .zoom-btn:hover{background:#fff}
    .zoom-label{font-size:.75rem;font-weight:600;color:rgba(255,255,255,.8);min-width:40px;text-align:center}
    .preview-scaler{transform-origin:top center;transition:transform .15s}
    /* A4 page */
    .cv-page{width:794px;min-height:1123px;background:#fff;box-shadow:0 4px 60px rgba(0,0,0,.22);color:#1a1a1a;font-size:10pt;line-height:1.5;position:relative;font-family:'Inter',sans-serif}

    /* Toast */
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:10px 22px;border-radius:999px;font-size:.81rem;font-weight:500;transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:9999;pointer-events:none;white-space:nowrap}
    #toast.show{transform:translateX(-50%) translateY(0)}
    #toast.ok{background:#059669} #toast.bad{background:#dc2626}

    /* Print */
    @media print{
      .topbar,.panel,.preview-controls{display:none!important}
      body{overflow:visible!important}
      .layout{display:block!important;margin-top:0!important;height:auto!important}
      .preview-wrap{padding:0!important;background:white!important;display:block!important}
      .preview-scaler{transform:none!important}
      .cv-page{box-shadow:none!important;width:100%!important}
    }

    /* ══════════════════════════════════════════
       CV TEMPLATE STYLES
    ══════════════════════════════════════════ */

    /* ── TEMPLATE 1: Classic (resume.io clean) ── */
    .t-classic .cv-header{padding:36px 48px 24px}
    .t-classic .cv-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:26pt;font-weight:900;letter-spacing:-.04em;color:#0f172a;line-height:1.05;margin-bottom:4px}
    .t-classic .cv-jobtitle{font-size:11pt;font-weight:500;color:var(--AC);margin-bottom:12px}
    .t-classic .cv-contacts{display:flex;gap:14px;flex-wrap:wrap;font-size:8.5pt;color:#64748b;border-top:2px solid var(--AC);padding-top:10px}
    .t-classic .cv-contact-item{display:flex;align-items:center;gap:4px}
    .t-classic .cv-body{display:grid;grid-template-columns:1fr 200px;gap:0;padding:24px 48px}
    .t-classic .cv-main{padding-right:32px;border-right:1px solid #e2e8f0}
    .t-classic .cv-side{padding-left:28px}
    .t-classic .cv-section{margin-bottom:22px}
    .t-classic .cv-section-title{font-size:7.5pt;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--AC);border-bottom:2px solid var(--AC);padding-bottom:4px;margin-bottom:10px}
    .t-classic .cv-item{margin-bottom:13px}
    .t-classic .cv-item-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
    .t-classic .cv-item-title{font-weight:700;font-size:10pt;color:#0f172a}
    .t-classic .cv-item-date{font-size:8pt;color:#94a3b8;white-space:nowrap;flex-shrink:0}
    .t-classic .cv-item-org{font-size:9pt;font-weight:600;color:var(--AC);margin-bottom:3px}
    .t-classic .cv-item-desc{font-size:8.5pt;color:#475569;line-height:1.6}
    .t-classic .cv-summary{font-size:9.5pt;color:#475569;line-height:1.7;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f1f5f9}
    .t-classic .skill-row{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
    .t-classic .skill-name{font-size:8.5pt;color:#0f172a;font-weight:500;margin-bottom:3px}
    .t-classic .skill-bar{height:4px;border-radius:2px;background:#f1f5f9;overflow:hidden}
    .t-classic .skill-fill{height:100%;border-radius:2px;background:var(--AC)}
    .t-classic .lang-item{display:flex;justify-content:space-between;font-size:8.5pt;margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid #f8fafc}
    .t-classic .lang-level{color:var(--AC);font-weight:600}
    .t-classic .cv-tag{display:inline-block;font-size:7.5pt;padding:2px 8px;border-radius:3px;background:#f1f5f9;color:#475569;margin:2px 2px 2px 0}

    /* ── TEMPLATE 2: Executive (dark header sidebar) ── */
    .t-executive .cv-header{background:var(--AC);padding:40px 48px 32px}
    .t-executive .cv-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:28pt;font-weight:900;letter-spacing:-.045em;color:#fff;line-height:1.05;margin-bottom:5px}
    .t-executive .cv-jobtitle{font-size:11.5pt;color:rgba(255,255,255,.75);font-weight:400;margin-bottom:14px;letter-spacing:.01em}
    .t-executive .cv-contacts{display:flex;gap:18px;flex-wrap:wrap;font-size:8.5pt;color:rgba(255,255,255,.7)}
    .t-executive .cv-contact-item{display:flex;align-items:center;gap:5px}
    .t-executive .cv-body{display:grid;grid-template-columns:230px 1fr;min-height:900px}
    .t-executive .cv-side{background:#f8fafc;padding:28px 22px;border-right:1px solid #e8ecf0}
    .t-executive .cv-main{padding:28px 36px 28px 32px}
    .t-executive .cv-section{margin-bottom:22px}
    .t-executive .cv-section-title{font-size:7.5pt;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--AC);border-bottom:2px solid var(--AC);padding-bottom:4px;margin-bottom:10px}
    .t-executive .cv-item{margin-bottom:14px}
    .t-executive .cv-item-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
    .t-executive .cv-item-title{font-weight:700;font-size:10.5pt;color:#0f172a}
    .t-executive .cv-item-date{font-size:8pt;color:#94a3b8;white-space:nowrap;flex-shrink:0}
    .t-executive .cv-item-org{font-size:9pt;font-weight:600;color:var(--AC);margin-bottom:4px}
    .t-executive .cv-item-desc{font-size:8.5pt;color:#475569;line-height:1.6}
    .t-executive .cv-summary{font-size:9.5pt;color:#475569;line-height:1.7;margin-bottom:22px}
    .t-executive .skill-row{margin-bottom:10px}
    .t-executive .skill-name{font-size:8.5pt;color:#334155;font-weight:500;margin-bottom:4px}
    .t-executive .skill-bar{height:4px;border-radius:2px;background:#e2e8f0;overflow:hidden}
    .t-executive .skill-fill{height:100%;background:var(--AC);border-radius:2px}
    .t-executive .lang-item{display:flex;justify-content:space-between;font-size:8.5pt;margin-bottom:7px}
    .t-executive .lang-level{color:var(--AC);font-weight:600}
    .t-executive .cv-tag{display:inline-block;font-size:7.5pt;padding:3px 8px;border-radius:4px;background:#e8ecf0;color:#475569;margin:2px}

    /* ── TEMPLATE 3: Europass (EU official style) ── */
    .t-europass{font-family:'Inter',sans-serif}
    .t-europass .cv-eurobar{height:6px;background:var(--AC)}
    .t-europass .cv-header{padding:24px 48px 20px;display:grid;grid-template-columns:1fr 88px;gap:24px;align-items:start;border-bottom:1px solid #dde3ec}
    .t-europass .cv-name{font-size:20pt;font-weight:800;color:var(--AC);letter-spacing:-.03em;margin-bottom:2px;line-height:1.1}
    .t-europass .cv-jobtitle{font-size:10pt;color:#64748b;font-weight:400;margin-bottom:10px}
    .t-europass .cv-contacts{display:flex;flex-direction:column;gap:4px;font-size:8pt;color:#64748b}
    .t-europass .cv-contact-item{display:flex;align-items:center;gap:5px}
    .t-europass .cv-photo{width:88px;height:110px;border:2px solid #e2e8f0;border-radius:4px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
    .t-europass .cv-photo svg{color:#94a3b8}
    .t-europass .cv-body{padding:0 48px 32px}
    .t-europass .cv-section{display:grid;grid-template-columns:150px 1fr;margin-bottom:4px;border-top:1px solid #e8ecf0;padding-top:14px;margin-top:10px}
    .t-europass .cv-section-title{font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--AC);padding-right:16px;padding-top:2px}
    .t-europass .cv-section-content{padding-left:16px;border-left:2px solid var(--AC)}
    .t-europass .cv-summary{font-size:9pt;color:#475569;line-height:1.65}
    .t-europass .cv-item{margin-bottom:12px}
    .t-europass .cv-item-row{display:flex;gap:16px;margin-bottom:2px}
    .t-europass .cv-item-date{font-size:8.5pt;color:#94a3b8;min-width:96px;flex-shrink:0;font-weight:500}
    .t-europass .cv-item-right{}
    .t-europass .cv-item-title{font-weight:700;font-size:9.5pt;color:#0f172a}
    .t-europass .cv-item-org{font-size:8.5pt;color:#475569;margin-bottom:3px}
    .t-europass .cv-item-desc{font-size:8.5pt;color:#64748b;line-height:1.55}
    .t-europass .eu-skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .t-europass .eu-skill-box{border:1px solid #e2e8f0;border-radius:5px;padding:5px 9px}
    .t-europass .eu-skill-name{font-size:8pt;font-weight:600;color:#0f172a;margin-bottom:3px}
    .t-europass .eu-skill-bar{height:3px;background:#e2e8f0;border-radius:2px;overflow:hidden}
    .t-europass .eu-skill-fill{height:100%;background:var(--AC);border-radius:2px}
    .t-europass .lang-table{width:100%;border-collapse:collapse;font-size:8pt}
    .t-europass .lang-table th{background:#f8fafc;color:#64748b;font-weight:600;text-transform:uppercase;font-size:7pt;letter-spacing:.06em;padding:5px 8px;border:1px solid #e8ecf0;text-align:left}
    .t-europass .lang-table td{padding:5px 8px;border:1px solid #e8ecf0;color:#475569}
    .t-europass .lang-table td:first-child{font-weight:600;color:#0f172a}

    /* ── TEMPLATE 4: Creative (colored sidebar) ── */
    .t-creative{display:flex;min-height:1123px}
    .t-creative .cv-sidebar{width:220px;flex-shrink:0;background:var(--AC);padding:32px 20px;display:flex;flex-direction:column;gap:0}
    .t-creative .cv-main-area{flex:1;padding:36px 32px}
    .t-creative .cv-photo-circle{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
    .t-creative .cv-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:15pt;font-weight:800;color:#fff;text-align:center;line-height:1.15;margin-bottom:4px}
    .t-creative .cv-jobtitle{font-size:8pt;color:rgba(255,255,255,.7);text-align:center;margin-bottom:20px;font-weight:400}
    .t-creative .sb-section{margin-bottom:18px}

<script>
// ── Theme ───────────────────────────────────────────────────
(function(){const t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);ti(t)})();
function ti(t){const s=document.getElementById('icon-sun'),m=document.getElementById('icon-moon');if(!s||!m)return;s.style.display=t==='dark'?'none':'';m.style.display=t==='dark'?'':'none'}
document.getElementById('theme-toggle').addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme')||'light';const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);ti(n)});

// ── State ────────────────────────────────────────────────────
const S={
  tpl:'classic', color:'#2563eb',
  name:'',title:'',email:'',phone:'',location:'',linkedin:'',website:'',summary:'',hobbies:'',
  exp:[], edu:[], skills:[], langs:[]

let _expId=0, _eduId=0, _skId=0, _lgId=0;

// ── Section collapse ──────────────────────────────────────────
document.querySelectorAll('.form-sect-head').forEach(h=>{
  h.addEventListener('click',()=>{
    const s=h.dataset.s, body=document.getElementById('body-'+s);

  });
});

// ── Template tabs ─────────────────────────────────────────────
const TPL_COLORS={classic:'#2563eb',executive:'#0f172a',europass:'#003399',creative:'#7c3aed',modern:'#0ea5e9'};
document.querySelectorAll('.tpl-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tpl-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); S.tpl=t.dataset.tpl;
    setColor(TPL_COLORS[S.tpl]||'#2563eb'); R();
  });
});

// ── Colors ───────────────────────────────────────────────────
function setColor(c){
  S.color=c;
  document.getElementById('custom-color').value=c;
  document.querySelectorAll('.cswatch').forEach(s=>s.classList.toggle('active',s.dataset.c===c));

}
document.querySelectorAll('.cswatch').forEach(s=>s.addEventListener('click',()=>setColor(s.dataset.c)));
document.getElementById('custom-color').addEventListener('input',e=>{

// ── Helpers ───────────────────────────────────────────────────
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sv=id=>document.getElementById(id)?.value||'';
function syncBasic(){
  ['name','title','email','phone','location','linkedin','website','summary','hobbies'].forEach(k=>{
    const el=document.getElementById('f-'+({'name':'name','title':'title','email':'email','phone':'phone','location':'loc','linkedin':'li','website':'web','summary':'sum','hobbies':'hobbies'}[k]));
    if(el) S[k]=el.value;
  });
}
function icon(t){
  const I={email:`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,phone:`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,loc:`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,link:`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`};

function contacts(light=false){

function sbar(pct,color,h=4){return`<div style="height:${h}px;border-radius:${h/2}px;background:#f1f5f9;overflow:hidden"><div style="height:100%;width:${pct}%;background:${color};border-radius:${h/2}px"></div></div>`}

  } else if(S.tpl==='executive'){
    cv.innerHTML=`
    <div class="cv-header"><div class="cv-name">${esc(S.name)||'Your Name'}</div><div class="cv-jobtitle">${esc(S.title)||'Job Title'}</div><div class="cv-contacts">${contacts(true)}</div></div>
    <div class="cv-body">
      <div class="cv-side">
        ${S.skills.length?`<div class="cv-section"><div class="cv-section-title">Skills</div>${skillsH_bars}</div>`:''}
        ${S.langs.length?`<div class="cv-section"><div class="cv-section-title">Languages</div>${langsH_classic}</div>`:''}
        ${S.edu.length?`<div class="cv-section"><div class="cv-section-title">Education</div>${S.edu.map(e=>`<div class="cv-item"><div style="font-weight:700;font-size:9pt">${esc(e.degree)}</div><div style="font-size:8.5pt;color:#475569">${esc(e.school)}</div><div style="font-size:8pt;color:#94a3b8">${esc(e.from)}${e.from&&e.to?' – ':''}${esc(e.to)}</div></div>`).join('')}</div>`:''}

  } else if(S.tpl==='europass'){
    const langTable=S.langs.length?`<table class="lang-table"><thead><tr><th>Language</th><th>Listening</th><th>Reading</th><th>Speaking</th><th>Writing</th></tr></thead><tbody>${S.langs.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.level)}</td><td>${esc(l.level)}</td><td>${esc(l.level)}</td><td>${esc(l.level)}</td></tr>`).join('')}</tbody></table>`:'';
    const euSkills=S.skills.length?`<div class="eu-skill-grid">${S.skills.map(s=>`<div class="eu-skill-box"><div class="eu-skill-name">${esc(s.name)}</div><div class="eu-skill-bar"><div class="eu-skill-fill" style="width:${s.lvl}%"></div></div></div>`).join('')}</div>`:'';
    const sec=(t,body)=>`<div class="cv-section"><div class="cv-section-title">${t}</div><div class="cv-section-content">${body}</div></div>`;
    const euExp=S.exp.map(e=>`<div class="cv-item"><div class="cv-item-row"><span class="cv-item-date">${esc(e.from)}${e.from&&e.to?' – ':''}${esc(e.to)}</span><div class="cv-item-right"><div class="cv-item-title">${esc(e.title)}</div><div class="cv-item-org">${esc(e.org)}</div><div class="cv-item-desc">${descHTML(e.desc)}</div></div></div></div>`).join('');
    const euEdu=S.edu.map(e=>`<div class="cv-item"><div class="cv-item-row"><span class="cv-item-date">${esc(e.from)}${e.from&&e.to?' – ':''}${esc(e.to)}</span><div class="cv-item-right"><div class="cv-item-title">${esc(e.degree)}</div><div class="cv-item-org">${esc(e.school)}</div>${e.note?`<div class="cv-item-desc">${esc(e.note)}</div>`:''}</div></div></div>`).join('');
    cv.innerHTML=`
    <div class="cv-eurobar"></div>
    <div class="cv-header">
      <div>
        <div class="cv-name">${esc(S.name)||'Your Name'}</div>
        <div class="cv-jobtitle">${esc(S.title)||'Curriculum Vitae'}</div>
        <div class="cv-contacts" style="display:flex;flex-direction:column;gap:4px">
          ${S.email?`<div class="cv-contact-item">${icon('email')} ${esc(S.email)}</div>`:''}
          ${S.phone?`<div class="cv-contact-item">${icon('phone')} ${esc(S.phone)}</div>`:''}
          ${S.location?`<div class="cv-contact-item">${icon('loc')} ${esc(S.location)}</div>`:''}

      </div>

    <div class="cv-body">
      ${S.summary?sec('Personal Statement',`<div class="cv-summary">${esc(S.summary)}</div>`):''}

function shiftHue(hex, deg){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),l=(max+min)/2;
  if(max===min)return hex;
  const d=max-min,s=l>0.5?d/(2-max-min):d/(max+min);
  let h=max===r?(g-b)/d+(g<b?6:0):max===g?(b-r)/d+2:(r-g)/d+4;
  h=(h/6*360+deg)%360;
  function hsl2rgb(h,s,l){const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1)};
  return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]}
  const[rr,gg,bb]=hsl2rgb(h,s,l);
  return'#'+[rr,gg,bb].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function addExp(d={}){
  const id=++_expId;

}
function removeExp(id){S.exp=S.exp.filter(e=>e.id!==id);renderExp();R()}
function renderExp(){

    <div class="fg2"><div class="field"><label>From</label><input value="${esc(e.from)}" placeholder="Jan 2020" oninput="S.exp[${i}].from=this.value;R()"/></div>
    <div class="field"><label>To</label><input value="${esc(e.to)}" placeholder="Present" oninput="S.exp[${i}].to=this.value;R()"/></div></div>
    <div class="field"><label>Description</label><textarea placeholder="• Led a team of 8 and grew revenue 40%&#10;• Launched 3 campaigns with 12,000+ leads" oninput="S.exp[${i}].desc=this.value;R()">${esc(e.desc)}</textarea></div>`;
    el.appendChild(d);

}

  renderEdu(); R();
}
function removeEdu(id){S.edu=S.edu.filter(e=>e.id!==id);renderEdu();R()}
function renderEdu(){
  const el=document.getElementById('edu-list');el.innerHTML='';
  S.edu.forEach((e,i)=>{
    const d=document.createElement('div');d.className='rep-item';
    d.innerHTML=`<div class="rep-item-head"><span class="rep-item-label">${e.school||e.degree||'Education '+(i+1)}</span><div class="rep-actions"><button class="rep-btn" onclick="removeEdu(${e.id})">✕</button></div></div>
    <div class="fg2"><div class="field"><label>Degree</label><input value="${esc(e.degree)}" placeholder="BSc Computer Science" oninput="S.edu[${i}].degree=this.value;R()"/></div>
    <div class="field"><label>School</label><input value="${esc(e.school)}" placeholder="MIT" oninput="S.edu[${i}].school=this.value;R();this.closest('.rep-item').querySelector('.rep-item-label').textContent=this.value||S.edu[${i}].degree||'Education'"/></div></div>
    <div class="fg2"><div class="field"><label>From</label><input value="${esc(e.from)}" placeholder="2018" oninput="S.edu[${i}].from=this.value;R()"/></div>
    <div class="field"><label>To</label><input value="${esc(e.to)}" placeholder="2022" oninput="S.edu[${i}].to=this.value;R()"/></div></div>
    <div class="field"><label>Notes</label><input value="${esc(e.note)}" placeholder="First Class Honours, GPA 3.9, Dean's List" oninput="S.edu[${i}].note=this.value;R()"/></div>`;
    el.appendChild(d);
  });
}

// ── Skills ──────────────────────────────────────────────────
function addSkill(d={}){
  const id=++_skId;
  S.skills.push({id,name:d.name||'',lvl:d.lvl||80});
  renderSkills(); R();
}
function removeSkill(id){S.skills=S.skills.filter(s=>s.id!==id);renderSkills();R()}
function renderSkills(){
  const el=document.getElementById('skill-list');el.innerHTML='';
  S.skills.forEach((sk,i)=>{
    const d=document.createElement('div');d.className='rep-item';
    d.innerHTML=`<div class="rep-item-head"><span class="rep-item-label">${sk.name||'Skill '+(i+1)}</span><div class="rep-actions"><button class="rep-btn" onclick="removeSkill(${sk.id})">✕</button></div></div>
    <div class="fg2"><div class="field"><label>Skill name</label><input value="${esc(sk.name)}" placeholder="e.g. Figma" oninput="S.skills[${i}].name=this.value;R();this.closest('.rep-item').querySelector('.rep-item-label').textContent=this.value||'Skill'"/></div>
    <div class="field"><label>Level: <strong id="sk${sk.id}">${sk.lvl}%</strong></label><input type="range" class="skill-slider" min="10" max="100" step="5" value="${sk.lvl}" oninput="S.skills[${i}].lvl=+this.value;document.getElementById('sk${sk.id}').textContent=this.value+'%';R()"/></div></div>`;
    el.appendChild(d);
  });
}

// ── Languages ───────────────────────────────────────────────
const LEVELS=['Native','Fluent','Advanced (C1)','Upper Intermediate (B2)','Intermediate (B1)','Elementary (A2)','Beginner (A1)'];
function addLang(d={}){
  const id=++_lgId;
  S.langs.push({id,name:d.name||'',level:d.level||'Intermediate (B1)'});
  renderLangs(); R();
}
function removeLang(id){S.langs=S.langs.filter(l=>l.id!==id);renderLangs();R()}
function renderLangs(){
  const el=document.getElementById('lang-list');el.innerHTML='';
  S.langs.forEach((l,i)=>{
    const d=document.createElement('div');d.className='rep-item';
    d.innerHTML=`<div class="rep-item-head"><span class="rep-item-label">${l.name||'Language '+(i+1)}</span><div class="rep-actions"><button class="rep-btn" onclick="removeLang(${l.id})">✕</button></div></div>
    <div class="fg2"><div class="field"><label>Language</label><input value="${esc(l.name)}" placeholder="Spanish" oninput="S.langs[${i}].name=this.value;R();this.closest('.rep-item').querySelector('.rep-item-label').textContent=this.value||'Language'"/></div>
    <div class="field"><label>Level</label><select oninput="S.langs[${i}].level=this.value;R()">${LEVELS.map(lv=>`<option${lv===l.level?' selected':''}>${lv}</option>`).join('')}</select></div></div>`;
    el.appendChild(d);
  });
}

// ── Zoom ────────────────────────────────────────────────────
let scale=1;
function zoom(delta){scale=Math.max(0.4,Math.min(1.5,scale+delta));applyScale()}
function resetZoom(){autoFit()}
function applyScale(){document.getElementById('scaler').style.transform=`scale(${scale})`;document.getElementById('scaler').style.marginBottom=`${(1123*scale)-1123+32}px`;document.getElementById('zoom-lbl').textContent=Math.round(scale*100)+'%'}
function autoFit(){const w=document.getElementById('preview-wrap').clientWidth-48;scale=Math.min(1,w/794);applyScale()}
window.addEventListener('resize',autoFit);

// ── Toast ────────────────────────────────────────────────────
function toast(m,t='ok'){const el=document.getElementById('toast');el.textContent=m;el.className='show '+t;clearTimeout(el._t);el._t=setTimeout(()=>el.className='',3000)}

// ── Download ──────────────────────────────────────────────────
function downloadPDF(){toast('Opening print dialog — choose "Save as PDF"');setTimeout(()=>window.print(),350)}
function printCV(){window.print()}
